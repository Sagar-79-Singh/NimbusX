name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Unexpected tag format: ${{ github.ref_name }}" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Fetch and verify pinned dependencies
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -Destination artifacts/payload/tools

      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/build.ps1 -SkipDependencies -Version ${{ steps.version.outputs.version }} -Payload artifacts/payload -SelfContained

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer/NimbusX.iss

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath artifacts/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body_path: BUILD_STATUS.md
