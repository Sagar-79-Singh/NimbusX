name: release

# Push a tag such as v1.0.0 and this workflow builds, tests, publishes, compiles the Inno Setup installer and attaches
# everything (installer, standalone NimbusX.exe, cpx.exe, SHA256SUMS.txt) to a GitHub Release.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (x.y.z), used when the run is not triggered by a tag'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          $candidate = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.version }}' }
          $version = $candidate.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Unexpected version: $candidate" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building NimbusX $version"

      - name: Fetch and verify the pinned dependencies
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -Destination artifacts/payload/tools

      - name: Verify the pinned dependencies
        shell: pwsh
        run: ./scripts/verify-deps.ps1 -ToolsDirectory artifacts/payload/tools

      - name: Build, test and publish the installer payload
        shell: pwsh
        run: ./scripts/build.ps1 -SkipDependencies -Version $env:VERSION -Payload artifacts/payload -SelfContained

      - name: Publish the standalone executable
        shell: pwsh
        run: |
          dotnet publish src/NimbusX.Desktop/NimbusX.Desktop.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:Version=$env:VERSION `
            -o artifacts/publish/single
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the standalone executable failed.' }
          New-Item -ItemType Directory -Force artifacts/dist | Out-Null
          Copy-Item artifacts/publish/single/NimbusX.exe artifacts/dist/NimbusX-$env:VERSION-win-x64.exe

      - name: Publish cpx
        shell: pwsh
        run: |
          dotnet publish src/NimbusX.Cli/NimbusX.Cli.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:DebugType=none `
            -p:Version=$env:VERSION -o artifacts/publish/cli
          if ($LASTEXITCODE -ne 0) { throw 'Publishing cpx failed.' }
          Copy-Item artifacts/publish/cli/cpx.exe artifacts/dist/cpx-$env:VERSION-win-x64.exe

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          & $iscc /DAppVersion=$env:VERSION installer/NimbusX.iss
          if ($LASTEXITCODE -ne 0) { throw 'Compiling the installer failed.' }

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts/dist/*.exe, artifacts/NimbusX-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: NimbusX-${{ steps.version.outputs.version }}
          path: |
            artifacts/dist/*.exe
            artifacts/NimbusX-Setup-*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist/*.exe
            artifacts/NimbusX-Setup-*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
